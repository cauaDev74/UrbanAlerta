# =====================================================================
# Perfil "banco": conecta no Supabase (PostgreSQL).
# NENHUM valor secreto fica neste arquivo: tudo vem do arquivo .env (veja o .env.example)
# ou das variáveis de ambiente da hospedagem.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Conexões abertas por instância. Em hospedagem serverless (Vercel), várias instâncias podem rodar ao mesmo
# tempo e o Supabase limita as conexões; por isso o padrão é pequeno. Ajuste com DB_POOL_MAX.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:3}

# "update": o Hibernate cria as tabelas se não existirem e adiciona colunas que faltarem, sem apagar dados.
# Depois da primeira execução você pode definir DDL_AUTO=validate para a inicialização ser mais rápida.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.h2.console.enabled=false
urbanalerta.armazenamento.rotulo=Banco de dados (PostgreSQL)

# Com o seu banco, nada de dados de demonstração nem de senhas padrão.
urbanalerta.dados-demonstracao=false

# OBRIGATÓRIO no perfil "banco": JWT_SEGREDO (mín. 32 caracteres). Sem ADMIN_SENHA nenhum administrador é criado.
urbanalerta.seguranca.jwt-segredo=${JWT_SEGREDO:}
urbanalerta.admin.nome=Administrador
urbanalerta.admin.email=${ADMIN_EMAIL:admin@urbanalerta.local}
urbanalerta.admin.senha=${ADMIN_SENHA:}
