spring.application.name=urbanalerta
server.port=${PORT:8080}

# Lê o arquivo .env (se existir) na pasta onde o programa é executado. Veja o .env.example.
# Em hospedagens, as mesmas chaves vêm das variáveis de ambiente do painel.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------
# Banco de dados (JPA + Hibernate)
# Padrão: H2, um banco que roda dentro do próprio programa (não precisa instalar nada).
# Os dados somem ao reiniciar. Para usar o seu banco, rode com o perfil "banco"
# (veja application-banco.properties e o README).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:urbanalerta;DB_CLOSE_DELAY=-1
spring.datasource.username=banco
spring.datasource.password=

# O Hibernate cria a tabela a partir da classe Ocorrencia e apaga ao encerrar.
spring.jpa.hibernate.ddl-auto=create-drop
# Fecha a sessão do banco no fim do serviço (não segura conexão durante a resposta HTTP).
spring.jpa.open-in-view=false
# Mude para true para ver no console os comandos SQL que o Hibernate executa.
spring.jpa.show-sql=false

# Console web do H2 (só para demonstração local): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Texto mostrado no topo da tela.
urbanalerta.armazenamento.rotulo=Banco H2 (some ao reiniciar)

# Carrega contas e 6 ocorrências FICTÍCIAS de demonstração ao iniciar (desligado no perfil "banco").
urbanalerta.dados-demonstracao=true

# ---------------------------------------------------------------
# Segurança (login com JWT)
# O segredo assina os tokens: em produção use um valor longo e secreto (variável JWT_SEGREDO).
# ---------------------------------------------------------------
urbanalerta.seguranca.jwt-segredo=segredo-de-desenvolvimento-troque-em-producao-0123456789
urbanalerta.seguranca.jwt-horas=8

# Administrador inicial, criado ao iniciar se ainda não existir.
# Estes valores são só para desenvolvimento/demonstração.
urbanalerta.admin.nome=Administrador
urbanalerta.admin.email=admin@urbanalerta.local
urbanalerta.admin.senha=admin123

# Origens (sites) autorizadas a chamar a API pelo navegador, separadas por vírgula.
# Só é necessário quando o front-end fica em outro domínio (ex.: front na Vercel e API no Render).
# Exemplo: urbanalerta.cors.origens=https://urban-alerta.vercel.app
urbanalerta.cors.origens=

# Serviço de geocodificação (Nominatim / OpenStreetMap).
# A política de uso exige um User-Agent que identifique o aplicativo e no máximo 1 consulta por segundo.
urbanalerta.nominatim.url=https://nominatim.openstreetmap.org/search
urbanalerta.nominatim.user-agent=UrbanAlerta-Prototipo/0.4 (IFBA Campus Irece; projeto academico)
