spring.application.name=urbanalerta
server.port=${PORT:8080}

# O caminho do .env é relativo ao diretório de trabalho da JVM; no IntelliJ, use a raiz do projeto.
# Em hospedagens, as mesmas chaves vêm das variáveis de ambiente do painel.
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL configurado por variáveis de ambiente ou pelo arquivo .env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:3}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Fecha a sessão do banco no fim do serviço (não segura conexão durante a resposta HTTP).
spring.jpa.open-in-view=false
# Mude para true para ver no console os comandos SQL que o Hibernate executa.
spring.jpa.show-sql=false

# Texto mostrado no topo da tela.
urbanalerta.armazenamento.rotulo=Banco de dados (PostgreSQL)

# ---------------------------------------------------------------
# Segurança (login com JWT)
# O segredo assina os tokens: em produção use um valor longo e secreto (variável JWT_SEGREDO).
# ---------------------------------------------------------------
urbanalerta.seguranca.jwt-segredo=${JWT_SEGREDO:}
urbanalerta.seguranca.jwt-horas=8

# Credenciais de administrador fornecidas pelo responsável pela instalação.
urbanalerta.admin.nome=Administrador
urbanalerta.admin.email=${ADMIN_EMAIL:}
urbanalerta.admin.senha=${ADMIN_SENHA:}

# Origens (sites) autorizadas a chamar a API pelo navegador, separadas por vírgula.
# Só é necessário quando o front-end fica em outro domínio (ex.: front na Vercel e API no Render).
# Exemplo: urbanalerta.cors.origens=https://urban-alerta.vercel.app
urbanalerta.cors.origens=

# Serviço de geocodificação (Nominatim / OpenStreetMap).
# A política de uso exige um User-Agent que identifique o aplicativo e no máximo 1 consulta por segundo.
urbanalerta.nominatim.url=https://nominatim.openstreetmap.org/search
urbanalerta.nominatim.user-agent=UrbanAlerta-Prototipo/0.4 (IFBA Campus Irece; projeto academico)
